<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CHZZK All-in-One</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { width: 350px; margin: 0; padding: 16px; color: #f2f2f2; background: #090909; }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; }
    .brand img { width: 44px; height: 44px; border: 1px solid #333; border-radius: 6px; }
    h1 { margin: 0 0 2px; font-size: 18px; letter-spacing: -.4px; }
    .brand p { margin: 0; color: #999; font-size: 12px; }
    h2 { margin: 19px 0 8px; color: #888; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
    .card { margin-bottom: 12px; padding: 2px 13px; border: 1px solid #2c2c2c; border-radius: 6px; background: #111; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 42px; padding: 9px 0; border-bottom: 1px solid #292929; cursor: pointer; user-select: none; }
    label:last-child { border-bottom: 0; }
    input[type="checkbox"] { position: relative; flex: 0 0 auto; width: 36px; height: 19px; margin: 0; border: 1px solid #555; border-radius: 3px; appearance: none; background: #242424; cursor: pointer; transition: background 90ms steps(2, end), border-color 90ms steps(2, end); }
    input[type="checkbox"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 2px; background: #8b8b8b; transition: transform 90ms steps(2, end), background 90ms steps(2, end); }
    input[type="checkbox"]:checked { border-color: #e8e8e8; background: #e8e8e8; }
    input[type="checkbox"]:checked::after { transform: translateX(17px); background: #111; }
    input[type="number"] { width: 64px; padding: 5px 7px; border: 1px solid #454545; border-radius: 3px; color: #fff; background: #080808; text-align: right; font: inherit; }
    input[type="number"]:focus { outline: 1px solid #ddd; border-color: #ddd; }
    .subsettings { margin: 0 -13px; padding: 2px 13px 6px; border-bottom: 1px solid #292929; background: #0c0c0c; }
    .subsettings label { min-height: 35px; padding: 6px 0; color: #aaa; font-size: 12px; }
    button { width: 100%; margin: 7px 0; padding: 10px; border: 1px solid #444; border-radius: 4px; color: #eee; background: #1b1b1b; font: 700 13px system-ui, sans-serif; cursor: pointer; transition: background 80ms steps(2, end), border-color 80ms steps(2, end); }
    button:hover { border-color: #777; background: #292929; }
    button:active { background: #080808; }
    #popupStatus { min-height: 15px; margin: 0 0 8px; color: #aaa; font-size: 12px; text-align: center; }
    #nextPowerTime { margin: 14px 0 7px; padding: 11px; border: 1px solid #333; border-radius: 4px; color: #aaa; background: #101010; text-align: center; font-size: 12px; }
    #timeDisplay { margin-left: 4px; color: #fff; font-weight: 700; }
    footer { margin-top: 15px; text-align: center; }
    footer a { color: #777; font-size: 11px; text-decoration: none; }
    footer a:hover { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <header class="brand">
    <img src="icons/icon-48.png" alt="Icon">
    <div><h1>CHZZK All-in-One</h1><p>치지직 올인원 도구</p></div>
  </header>

  <h2>스트리밍 최적화</h2>
  <div class="card">
    <label>GRID 강제 우회 (P2P 차단) <input type="checkbox" data-feature="gridBypass"></label>
    <label>방향키 탐색 (5초 앞뒤 이동) <input type="checkbox" data-feature="arrowSeek"></label>
    <label>스크린샷 툴 <input type="checkbox" data-feature="screenshot"></label>
    <label>녹화 툴 <input type="checkbox" data-feature="recorder"></label>
    <label>자동 음소거 해제 <input type="checkbox" data-feature="autoUnmute"></label>
    <label>광고·치트키 안내 팝업 제거 <input type="checkbox" data-feature="hideAdPopup"></label>
    
    <label>영상 필터 (밝기/대비/선명도) <input type="checkbox" data-feature="videoFilters"></label>
    <div class="subsettings" id="videoFilterSettings">
      <label>밝기 (%) <input type="number" min="50" max="200" step="10" data-trend-option="brightnessAmount"></label>
      <label>대비 (%) <input type="number" min="50" max="200" step="10" data-trend-option="contrastAmount"></label>
      <label>선명도 강도 (%) <input type="number" min="0" max="300" step="10" data-trend-option="sharpnessAmount"></label>
    </div>
  </div>

  <h2>채팅 및 탐색 개선</h2>
  <div class="card">
    <label>블라인드 채팅 원본 복구 <input type="checkbox" data-feature="blindRestore"></label>
    <label>치즈 후원 채팅 숨기기 <input type="checkbox" data-feature="hideDonation"></label>
    <label>채팅창 글자 크기 강제 조절 <input type="checkbox" data-feature="chatFontSizeEnabled"></label>
    <div class="subsettings" id="chatFontSettings">
      <label>글자 크기 (px) <input type="number" min="10" max="30" step="1" data-trend-option="chatFontSize"></label>
    </div>
    <label>팔로잉 사이드바 자동 갱신 <input type="checkbox" data-feature="sidebarRefresh"></label>
    <label>마우스 오버 방송 미리보기 <input type="checkbox" data-feature="hoverPreview"></label>
  </div>

  <h2>방송 알림 & 트렌드</h2>
  <div class="card">
    <label>팔로잉 방송 시작 팝업 <input type="checkbox" data-feature="followingAlerts"></label>
    <button id="testFollowingAlert" type="button">방송 시작 알림 테스트</button>
    <p id="popupStatus" role="status" aria-live="polite"></p>
    
    <label>실시간 인기 방송 바 <input type="checkbox" data-feature="trends"></label>
    <div class="subsettings" id="trendSettings">
      <label>기준 시청자 <input type="number" min="0" step="100" data-trend-option="minViewers"></label>
      <label>표시 방송 수 <input type="number" min="1" max="30" data-trend-option="displayCount"></label>
      <label>갱신 주기 (분) <input type="number" min="1" max="60" data-trend-option="refreshMinutes"></label>
    </div>
  </div>

  <h2>통나무 파워 자동화</h2>
  <div class="card">
    <label>파워 자동 획득 활성화 <input id="toggle" type="checkbox"></label>
    <label>통나무 배지 표시 <input id="badgeToggle" type="checkbox"></label>
    <label>예상 획득 시간 표시 <input id="clockToggle" type="checkbox"></label>
    <label>획득 요약 리포트 표시 <input id="powerSummaryToggle" type="checkbox"></label>
    <label>움직이는 프로필 (GIF) 재생 <input id="movingGifProfileToggle" type="checkbox"></label>
  </div>
  
  <div id="nextPowerTime">다음 통나무 파워 획득: <span id="timeDisplay">계산 중…</span></div>
  <button id="viewLogs" type="button">통나무 파워 획득 로그 확인</button>
  
  <footer><a href="NOTICE" target="_blank" rel="noopener">출처 및 라이선스 정보</a></footer>
  <script src="popup.js"></script>
</body>
</html>
